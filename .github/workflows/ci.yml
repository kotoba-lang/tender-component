name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  clojure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - run: clojure -M:test
      - run: clojure -M:lint
  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f
        with:
          version: "1.243.0"
      - run: npm ci
      - run: cargo test --locked --manifest-path native/component-host/Cargo.toml
      - run: cargo build --locked --manifest-path native/component-host/Cargo.toml
      - name: Kotoba source to typed Component provider E2E
        run: clojure -M:test
        env:
          KOTOTAMA_COMPONENT_HOST: ${{ github.workspace }}/native/component-host/target/debug/tender-component-host
          KOTOTAMA_JCO_COMPONENT_HOST: ${{ github.workspace }}/native/jco-component-host.mjs
  browser-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f
        with:
          version: "1.243.0"
      - run: npm ci
      - name: Compile and transpile the portable Component boundary
        run: |
          git clone https://github.com/kotoba-lang/compiler.git ../compiler
          git -C ../compiler checkout --detach 3a47501190d906cb0c3995025d2fe0309db47add
          (
            cd ../compiler
            clojure -M -m kotoba.compiler.cli compile \
              "$GITHUB_WORKSPACE/qualification/browser-component.kotoba" \
              --target component \
              --output "$GITHUB_WORKSPACE/web/browser.component.wasm"
          )
          npx jco transpile web/browser.component.wasm \
            -o web/generated --name component --no-typescript --quiet
      - name: Verify the jco-transpiled Component surface in Chromium
        run: |
          python3 -m http.server 4173 --directory web >/tmp/tender-component-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          result=$(google-chrome --headless --disable-gpu --no-sandbox \
            --virtual-time-budget=15000 --dump-dom \
            http://127.0.0.1:4173/verify-component-browser.html)
          echo "$result" | grep 'PASS:compiler-component-jco-chromium:42'
  workerd-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f
        with:
          version: "1.243.0"
      - run: npm ci
      - name: Compile the typed v0.3 Component
        run: |
          git clone https://github.com/kotoba-lang/compiler.git ../compiler
          git -C ../compiler checkout --detach 57237db2b17f98db2c1f34115cf8205cc7f4294e
          (
            cd ../compiler
            clojure -M -m kotoba.compiler.cli compile \
              "$GITHUB_WORKSPACE/qualification/workerd-component.kotoba" \
              --target wasm-component-kotoba-v2 \
              --policy "$GITHUB_WORKSPACE/qualification/workerd-policy.edn" \
              --output "$GITHUB_WORKSPACE/qualification/workerd.component.wasm"
          )
          component_wit=$(wasm-tools component wit qualification/workerd.component.wasm)
          echo "$component_wit" | grep 'import aiueos:capability/capability@0.3.0'
          echo "$component_wit" | grep 'import aiueos:capability/log@0.3.0'
      - name: Transpile and execute the same Component in workerd
        run: |
          npx jco transpile qualification/workerd.component.wasm \
            -o qualification/workerd/generated --name component \
            --no-typescript --quiet -I sync
          npx workerd serve -I node_modules \
            qualification/workerd/workerd.capnp >/tmp/tender-workerd.log 2>&1 &
          workerd_pid=$!
          trap 'kill "$workerd_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if result=$(curl --fail --silent http://127.0.0.1:4174/); then
              echo "$result" | grep 'PASS:compiler-component-jco-workerd:log-append'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tender-workerd.log
          exit 1
